<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free VAPID Key Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/web-push@3.5.0/src/index.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto;">
  <h1>🔐 VAPID Key Generator</h1>
  <p>Click the button to generate your free VAPID keys.</p>
  <button onclick="generateKeys()" style="background: #B4542C; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px;">Generate VAPID Keys</button>
  <div id="output" style="margin-top: 20px;"></div>

  <script>
    async function generateKeys() {
      try {
        // web-push library exposes generateVAPIDKeys from the CDN
        const vapidKeys = await webpush.generateVAPIDKeys();
        document.getElementById('output').innerHTML = `
          <p><strong>Public Key:</strong><br><code style="word-break: break-all;">${vapidKeys.publicKey}</code></p>
          <p><strong>Private Key:</strong><br><code style="word-break: break-all;">${vapidKeys.privateKey}</code></p>
          <p style="color:green;">✅ Copy these keys and use them in your Render environment variables.</p>
        `;
      } catch (err) {
        document.getElementById('output').innerHTML = `<p style="color:red;">Error generating keys: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
