<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    .msg { background: white; padding: 10px; margin: 8px 0; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .err { color: red; }
    .ok { color: green; }
    button { background: #1e40af; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>Push Notification Test</h2>
  <div id="log"></div>
  <script>
    const log = (msg, isError) => {
      const d = document.createElement('div');
      d.className = 'msg' + (isError ? ' err' : ' ok');
      d.textContent = msg;
      document.getElementById('log').appendChild(d);
    };

    async function runTest() {
      log('Service Worker registration...');
      if (!('serviceWorker' in navigator)) {
        log('❌ Service Worker not supported', true);
        return;
      }
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        log('✅ SW registered');
        await navigator.serviceWorker.ready;

        log('Checking notification permission...');
        if (Notification.permission === 'denied') {
          log('❌ Notification permission is denied. Please go to site settings and allow notifications.', true);
          return;
        }
        let permission = Notification.permission;
        if (permission === 'default') {
          log('Requesting permission...');
          permission = await Notification.requestPermission();
          log('Permission result: ' + permission);
        }
        if (permission !== 'granted') {
          log('❌ Permission not granted', true);
          return;
        }
        log('✅ Permission granted');

        log('Subscribing to push...');
        const vapidPublicKey = 'YOUR_VAPID_PUBLIC_KEY'; // 👈 Replace with your actual public key
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });
        log('✅ Subscription successful!');
        log('Subscription endpoint: ' + sub.endpoint.substring(0, 50) + '...');
        log('Now go to Admin Homework and add a homework to receive notification.');
      } catch (err) {
        log('❌ Error: ' + err.message, true);
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button');
      btn.textContent = 'Start Test';
      btn.onclick = runTest;
      document.body.insertBefore(btn, document.getElementById('log'));
    });
  </script>
</body>
</html>
