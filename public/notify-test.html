<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notify Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4ff; }
    button { background: #1e40af; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-size: 16px; margin-top: 20px; }
    pre { background: white; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h2>📤 Notify API Test</h2>
  <p>यह पेज Admin Homework जैसा ही नोटिफिकेशन ट्रिगर करेगा और रिस्पॉन्स दिखाएगा।</p>
  <button onclick="sendTest()">Send Test Notification</button>
  <pre id="output"></pre>
  <script>
    async function sendTest() {
      const output = document.getElementById('output');
      output.textContent = 'Sending...';
      try {
        const res = await fetch('/api/push/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: '🧪 Test Notification',
            body: 'यह एक टेस्ट नोटिफिकेशन है।',
            url: '/student-corner',
            targetClass: null,
          }),
          credentials: 'include',   // admin cookie required
        });
        const data = await res.json();
        output.textContent = 'Status: ' + res.status + '\n\n' + JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
