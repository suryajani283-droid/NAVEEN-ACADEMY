name: Daily Database Backup

on:
  schedule:
    - cron: '0 20 * * *'   # रोज़ 8 PM UTC (भारत में 2 AM)
  workflow_dispatch:        # मैन्युअली चलाने के लिए

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: db-backups

      - name: Setup PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create backups directory
        run: mkdir -p backups

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump \
            -h ${{ secrets.SUPABASE_DB_HOST }} \
            -U postgres \
            -d postgres \
            --no-owner \
            --clean \
            --if-exists \
            > backups/db-backup-$(date +'%Y-%m-%d').sql

      - name: Commit and push backup
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backups/
          git commit -m "Database backup $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin db-backups --force