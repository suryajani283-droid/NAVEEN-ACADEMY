name: Daily Database Backup

on:
  schedule:
    - cron: '0 20 * * *'   # 2 AM IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # शांत करें Node 20 चेतावनी
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: db-backups

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client dnsutils

      - name: Dump database (IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        run: |
          IP=$(dig +short A $DB_HOST | head -1)
          if [ -z "$IP" ]; then IP=$DB_HOST; fi
          echo "Connecting to $IP"
          pg_dump -h $IP -U postgres -d postgres --no-owner --clean --if-exists > backup-$(date +'%Y-%m-%d').sql

      - name: Commit and push backup
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.sql
          git commit -m "Database backup $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin db-backups --force